# === 架构模式索引 ===

patterns:
  - name: 事件驱动
    location: BtlSvr.Main
    key_types: [BGW_EventCollection, BGW_UIEventCollection]
    count: "300+ delegate fields"

  - name: ECS 数据模型
    location: GSE.Core + BtlSvr.Main
    key_types: [EntityManager, NativeList<T>, NativeHashMap<TKey,TValue>, Chunk]
    usage: "运行时 ECS（GSE.Core） + 持久化 BGC/BPC/BUC 容器（GSE.ProtobufDB）"

  - name: FSM 状态机
    location: BtlSvr.Main + GSE.ProtobufDB
    key_types: [CFSMGReg, FSMRuntimeInstance_GI_Global]
    sub_systems: [GI_Global, GI_Loading, PS_Transaction, Calliope FSM]

  - name: UI 框架 (GSUI)
    location: B1UI_GSE.Script
    key_types: [GSDObject, GSDStore, GSUIView, GSUIPage, GSAction]
    pattern: "数据存储（DS*）+ 视图（VI*）+ Action 驱动状态变化"

  - name: GSMUI 动画
    location: BtlSvr.Main
    key_types: [GSMUIEventBase, GSMUITweenFade, GSMUITweenFloat, GSMUIEventSequence]
    usage: "补间动画系统"

  - name: 预测/回滚
    location: GSE.Core
    key_types: [GSPredictionKey, IPredictableObject, NormalPredictionDataSet<T>]

  - name: Protobuf 数据驱动
    location: GSE.ProtobufDB
    pattern: "FUSt*Desc（单行配置）+ TBFUSt*Desc（表级封装）"
    usage: "所有战斗/AI/角色/技能配置均来自 Protobuf 定义"

  - name: Delta 同步
    location: GSE.ProtobufDB (GurGsPersistent + GurGsStruct)
    key_types: [DictDeltaMsg*, ListDeltaMsg*, ClassDeltaMsg*]

  - name: C++ 互操作
    location: GSE.Core + b1.Native
    key_mechanisms: ["[UClass]/[UProperty]/[UFunction] 属性标记", "CppExport 委托绑定", "TStrongObjectPtr<T>"]

  - name: ILRuntime 热更新
    location: BtlSvr.Main
    key_types: [CrossBindingAdaptor, MyAdaptor, ILRuntimeBinding]
    note: "CLR 交叉绑定适配器使热更脚本可继承 UE 原生类型"
